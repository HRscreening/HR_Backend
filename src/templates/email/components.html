{% macro cta_button(url, label) %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px auto;">
  <tr>
    <td align="center" style="border-radius:6px;background-color:#4f46e5;">
      <a href="{{ url }}" target="_blank"
         style="display:inline-block;padding:14px 32px;color:#ffffff;font-size:15px;
                font-weight:600;text-decoration:none;border-radius:6px;
                background-color:#4f46e5;">
        {{ label }}
      </a>
    </td>
  </tr>
</table>
{% endmacro %}


{% macro greeting(name) %}
<p style="margin:0 0 16px;font-size:16px;color:#111827;font-weight:500;">
    Hi {{ name }},
</p>
{% endmacro %}


{% macro info_row(label, value, border=True) %}
<tr>
    <td style="padding:10px 14px;font-size:14px;color:#6b7280;
               border-bottom:{{ '1px solid #e5e7eb' if border else 'none' }};">
        {{ label }}
    </td>
    <td style="padding:10px 14px;font-size:14px;color:#111827;
               border-bottom:{{ '1px solid #e5e7eb' if border else 'none' }};">
        {{ value }}
    </td>
</tr>
{% endmacro %}
